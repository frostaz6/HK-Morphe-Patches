name: Publish Morphe patch bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' gradle.properties | head -1)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "patches-$version.mpp"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version v$version already published; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'
      - name: Build patch bundle
        if: steps.version.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList --no-daemon
      - name: Release patch bundle
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          bundle="patches/build/libs/patches-$VERSION.mpp"
          test -s "$bundle"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$bundle#patches-$VERSION.mpp" --clobber
          else
            gh release create "v$VERSION" "$bundle#patches-$VERSION.mpp" \
              --target "$GITHUB_SHA" \
              --title "HK Morphe Patches v$VERSION" \
              --notes "Fixes Sync for Reddit Imgur albums with the personal Imgur ID from Spoof client. Includes previous fixes."
          fi
          # Remove the documentation-only file accidentally attached during v1.9.2 publishing.
          gh release delete-asset "v$VERSION" "patches-$VERSION-javadoc.mpp" --yes || true

