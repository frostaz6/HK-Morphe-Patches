name: Publish Sync patch bundle v1.9.1

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList --no-daemon
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle=$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)
          test -n "$bundle"
          echo "Publishing $bundle"
          if gh release view v1.9.1 >/dev/null 2>&1; then
            gh release upload v1.9.1 "$bundle#patches-1.9.1.mpp" --clobber
          else
            gh release create v1.9.1 "$bundle#patches-1.9.1.mpp" \
              --target "$GITHUB_SHA" \
              --title "HK Morphe Patches v1.9.1" \
              --notes "Fixes Sync for Reddit shutdown/Lemmy startup prompt and shared /s/ post links."
          fi
